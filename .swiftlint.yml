# SwiftLint configuration for speakfree
# CI runs this configuration with --strict as a blocking gate.
# Rules tuned to match the current codebase style — large files, long functions, and
# short identifier names (e.g. "fn", "p", "e") are intentional patterns here.

# Paths to exclude from linting
excluded:
  - .build
  - build
  - windows
  - Tests/SpeakFreeTests/AudioFixtures
  - Sources/CWhisper
  - Sources/CTryCatch
  # Upstream FluidAudio implementation; keep our package manifest and iOS app linted.
  - ios/Vendor/FluidAudioASRPackage/Sources/FluidAudio

# Disabled rules — either high-noise for this codebase or stylistic choices
# that are already intentional (long functions, long files, etc.).
disabled_rules:
  # Metrics — these files are intentionally large (AppDelegate, SettingsWindow)
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - function_parameter_count
  - large_tuple
  # Style — high noise, not yet adopted
  - trailing_whitespace
  - trailing_comma
  - opening_brace
  - multiple_closures_with_trailing_closure
  - closure_parameter_position
  - vertical_whitespace
  - statement_position
  - colon
  - comma
  # Idiom — too many false positives in this codebase
  - for_where
  - identifier_name
  - non_optional_string_data_conversion
  - implicit_optional_initialization
  - redundant_discardable_let
  - syntactic_sugar
  - redundant_string_enum_value
  - unused_closure_parameter
  - nesting
  - force_try
  - force_cast
  - type_name

# Keep all other default rules active; CI's --strict promotes warnings to failures.

