#
# Runs scripts/check-component-updates.py weekly and on manual dispatch, then opens or
# updates a single tracking issue with the results. Uses only the built-in `gh` CLI
# (GITHUB_TOKEN) — no third-party actions. Never fails the workflow just because
# updates are available (the script's exit code 1 means "something is behind", not
# "something broke"); it only fails when the script itself errors (exit code 2, e.g. a
# network/API failure) so a red run always means "go look," not "a dependency aged."
name: Component updates

on:
  schedule:
    # Every Monday 09:00 UTC (01:00 Pacific Standard Time / 02:00 Pacific Daylight Time —
    # cron always runs in UTC regardless of daylight saving).
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run component update check
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python3 scripts/check-component-updates.py --repo . > component-updates-report.md
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e
          cat component-updates-report.md

      - name: Fail only on a real script error (exit code 2)
        if: steps.check.outputs.exit_code == '2'
        run: |
          echo "::error::check-component-updates.py errored (network/API failure) — see the run log above. This is NOT 'updates are available', it's 'the check itself failed'."
          exit 1

      - name: Open or update the tracking issue
        if: steps.check.outputs.exit_code != '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TITLE="Component updates available"
          BODY_FILE="component-updates-report.md"
          {
            echo "_Auto-generated by [component-updates.yml](../actions/workflows/component-updates.yml) — do not edit by hand, it will be overwritten on the next run._"
            echo ""
            cat "$BODY_FILE"
            echo ""
            echo "---"
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > issue-body.md

          EXISTING_ISSUE=$(gh issue list --repo "$REPO" --state open --search "in:title \"$TITLE\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")][0].number")

          if [ -n "$EXISTING_ISSUE" ] && [ "$EXISTING_ISSUE" != "null" ]; then
            echo "Updating existing issue #$EXISTING_ISSUE"
            gh issue edit "$EXISTING_ISSUE" --repo "$REPO" --body-file issue-body.md
          else
            echo "Opening new issue"
            gh issue create --repo "$REPO" --title "$TITLE" --body-file issue-body.md
          fi

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: component-updates-report
          path: component-updates-report.md
          retention-days: 90
