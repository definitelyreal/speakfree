name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install whisper-cpp
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: brew install whisper-cpp

      - name: Build
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: swift build -c release

  unit-tests:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install whisper-cpp
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: brew install whisper-cpp

      - name: Cache tiny.en whisper model
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.config/speakfree/models/ggml-tiny.en.bin
          key: whisper-model-tiny.en-v1

      - name: Download tiny.en whisper model
        if: (github.event_name == 'push' || steps.filter.outputs.swift == 'true') && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.config/speakfree/models
          curl -fL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" \
            -o ~/.config/speakfree/models/ggml-tiny.en.bin

      - name: Write speakfree config for CI (use tiny.en)
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: |
          mkdir -p ~/.config/speakfree
          printf '%s\n' \
            '{' \
            '  "hotkey": {"keyCode": 63, "modifiers": []},' \
            '  "modelSize": "tiny.en",' \
            '  "engine": "whisper",' \
            '  "language": "en",' \
            '  "maxRecordings": 30,' \
            '  "rememberWords": true,' \
            '  "screenContext": true,' \
            '  "spokenPunctuation": "hybrid"' \
            '}' > ~/.config/speakfree/config.json

      - name: Unit tests
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        # --no-parallel + line-buffered tee so per-test "Test Case '…' started/passed" lines
        # stream live to the log. If the suite hangs, the LAST "started" line with no matching
        # "passed/failed" identifies the culprit test.
        # Stall watchdog (audit 2026-07-01): a hung test used to burn the full 20-min
        # timeout-minutes on every push (red-is-normal). Now: if the log stops growing for
        # 300s (build steps can be quiet; tests never are), kill xctest so the job fails in
        # minutes with the culprit named instead of timing out with no verdict.
        run: |
          set -o pipefail
          touch swift-test.log
          (
            while true; do
              sleep 60
              if [ -z "$(find swift-test.log -newermt '-300 seconds' 2>/dev/null)" ]; then
                echo "::error::swift test produced no output for 300s — treating as hung. Last started tests:"
                grep "' started" swift-test.log | tail -3 || true
                pkill -9 -x xctest 2>/dev/null || true
              fi
            done
          ) &
          WATCHDOG=$!
          trap 'kill $WATCHDOG 2>/dev/null || true' EXIT
          xcrun swift test --no-parallel 2>&1 | tee swift-test.log

  perf:
    # T2.0 perf-regression harness. Benchmarks the audio golden fixtures and compares against the
    # CI-fingerprint baseline (Tests/PerfBaseline/baseline-ci.json) with --require-baseline.
    #
    # NON-BLOCKING since 2026-07-03 (audit): shared macOS runners showed +35-66% run-to-run
    # variance on identical code — WITHIN a single run the seed measured 3136ms and the gate
    # 4204ms two minutes later — so the locked +15% threshold is a coin flip there and its
    # red trained everyone to ignore CI (the condition that hid the 21-day red streak).
    # The benchmark still runs and uploads perf-report.json for trend review; a failure
    # annotates the run instead of failing it. Re-block if CI ever moves to quiet hardware.
    # The dev-Mac baseline.json is kept for LOCAL enforcement (run `perf-harness
    # bench-and-gate --baseline Tests/PerfBaseline/baseline.json --require-baseline` on the
    # dev M3 Max, where the +15% gate is meaningful).
    #
    # BASELINE PERSISTENCE (audit 2026-07-03): the old design committed baseline-ci.json to
    # main, which branch protection rejects (GH006) on every run — the baseline never
    # persisted and every push re-seeded from scratch. It now persists via the Actions
    # cache ("latest seed wins"); the fingerprint check below re-seeds when the runner
    # image changes. Timings are still never fabricated off-runner.
    runs-on: macos-15
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Restore CI perf baseline (latest seed)
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: Tests/PerfBaseline/baseline-ci.json
          # The save key includes the unique run id, so this key never hits directly;
          # restore-keys prefix-matches the most recently saved baseline.
          key: perf-baseline-ci-${{ github.run_id }}
          restore-keys: |
            perf-baseline-ci-

      - name: Check for Swift changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install whisper-cpp
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: brew install whisper-cpp

      - name: Cache tiny.en whisper model
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.config/speakfree/models/ggml-tiny.en.bin
          key: whisper-model-tiny.en-v1

      - name: Download tiny.en whisper model
        if: (github.event_name == 'push' || steps.filter.outputs.swift == 'true') && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.config/speakfree/models
          curl -fL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" \
            -o ~/.config/speakfree/models/ggml-tiny.en.bin

      - name: Write speakfree config for CI (use tiny.en)
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: |
          mkdir -p ~/.config/speakfree
          printf '%s\n' \
            '{' \
            '  "hotkey": {"keyCode": 63, "modifiers": []},' \
            '  "modelSize": "tiny.en",' \
            '  "engine": "whisper",' \
            '  "language": "en",' \
            '  "maxRecordings": 30,' \
            '  "rememberWords": true,' \
            '  "screenContext": true,' \
            '  "spokenPunctuation": "hybrid"' \
            '}' > ~/.config/speakfree/config.json

      - name: Perf baseline provenance guard (PR only)
        # AR-2 R1 finding #2 (gaming): the baseline files are plain committed JSON with no integrity
        # binding. A regression could be landed by REGENERATING the baseline in the same PR
        # (perf-harness run --out Tests/PerfBaseline/baseline.json) so the gate compares the
        # regression against an already-regressed baseline → pass. Guard: a PR may NOT modify either
        # perf baseline. Only the trusted push-time "Self-seed CI baseline" step (which persists
        # via the Actions cache) may write baseline-ci.json. A PR that touches a baseline FAILS here.
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '^Tests/PerfBaseline/baseline(-ci)?\.json$'; then
            echo "::error::This PR modifies a perf baseline (Tests/PerfBaseline/baseline*.json)."
            echo "::error::Baselines may not be hand-edited or regenerated in a PR — that games the +15% gate."
            echo "::error::The CI baseline is seeded automatically on push to main. Revert the baseline change."
            echo "$CHANGED" | grep -E '^Tests/PerfBaseline/baseline(-ci)?\.json$'
            exit 1
          fi
          echo "OK: no perf baseline modified in this PR."

      - name: Build perf-harness
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: xcrun swift build -c release --product perf-harness

      - name: Self-seed CI baseline on first run (push only)
        # Bootstrap: the gate can ONLY compare against a baseline measured on THIS runner's
        # fingerprint — timings can't be fabricated off-runner without re-introducing the
        # gameable no-op. On a push where the restored cache has no fingerprint-matching CI
        # baseline (first run, or runner image changed), generate one HERE (real measured
        # numbers). The cache-save step below persists it for subsequent runs.
        id: seed
        if: github.event_name == 'push'
        run: |
          set -o pipefail
          NEED_SEED=1
          if [ -f Tests/PerfBaseline/baseline-ci.json ]; then
            .build/release/perf-harness run --iterations 1 --engines whisper --out fp-probe.json
            CAND_FP=$(python3 -c "import json;f=json.load(open('fp-probe.json'))['fingerprint'];print(f\"{f['cpu']}|{f['cores']}|{f['arch']}\")")
            BASE_FP=$(python3 -c "import json;f=json.load(open('Tests/PerfBaseline/baseline-ci.json'))['fingerprint'];print(f\"{f['cpu']}|{f['cores']}|{f['arch']}\")")
            if [ "$CAND_FP" = "$BASE_FP" ]; then NEED_SEED=0; fi
          fi
          if [ "$NEED_SEED" = "1" ]; then
            echo "No fingerprint-matching CI baseline — seeding from this runner."
            .build/release/perf-harness run --iterations 7 --engines whisper --out Tests/PerfBaseline/baseline-ci.json
            echo "seeded=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI baseline fingerprint matches — gate will compare."
            echo "seeded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Persist seeded CI baseline
        if: github.event_name == 'push' && steps.seed.outputs.seeded == 'true'
        uses: actions/cache/save@v4
        with:
          path: Tests/PerfBaseline/baseline-ci.json
          key: perf-baseline-ci-${{ github.run_id }}

      - name: Perf benchmark + regression gate
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        # Whisper only (parakeet auto-skips when its multi-GB CoreML assets aren't on the runner).
        # ADVISORY on CI (job is continue-on-error, see job comment): observed same-runner noise
        # (+35-66% between two measurements minutes apart) makes the +15% threshold unenforceable
        # on shared runners. A failure here annotates the run for trend review; the report
        # artifact below is the durable record. Retry-once still filters single-sample flakes.
        run: |
          .build/release/perf-harness bench-and-gate \
            --iterations 7 \
            --engines whisper \
            --out perf-report.json \
            --baseline Tests/PerfBaseline/baseline-ci.json \
            --threshold 15 \
            --require-baseline \
          || { echo "::warning::Perf gate failed — retrying once to rule out runner noise"; \
            .build/release/perf-harness bench-and-gate \
              --iterations 7 \
              --engines whisper \
              --out perf-report.json \
              --baseline Tests/PerfBaseline/baseline-ci.json \
              --threshold 15 \
              --require-baseline; }

      - name: Upload perf report
        if: (github.event_name == 'push' || steps.filter.outputs.swift == 'true') && always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: perf-report.json
          if-no-files-found: ignore

  swiftlint:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint (warning-only — non-blocking)
        # Non-blocking: exit code is ignored. Gate (removing continue-on-error) comes
        # once the codebase is cleaned up (post-M1).
        continue-on-error: true
        run: swiftlint

  version-check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency check
        run: bash scripts/check-version.sh

  install-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install whisper-cpp
        run: brew install whisper-cpp

      - name: Install smoke test
        run: bash scripts/test-install.sh

  transcription-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper-cpp
        run: brew install whisper-cpp

      - name: Build
        run: swift build -c release

      - name: Write speakfree config for CI (whisper engine)
        # test-transcription.sh asserts the whisper path (`speakfree status` must print
        # "whisper-cpp: yes"). Without a config, Config.load() falls back to the
        # Parakeet-first defaults (engine=parakeet) and cmdStatus never prints that
        # line — the job failed deterministically on every push since the default
        # flipped (audit 2026-07-01). NOTE: the JSON must include every non-optional
        # Config field (hotkey, modelSize, language) — a partial config fails decode
        # and SILENTLY falls back to defaultConfig, re-breaking this job. Keep it in
        # sync with the unit-tests job's config step.
        run: |
          mkdir -p ~/.config/speakfree
          printf '%s\n' \
            '{' \
            '  "hotkey": {"keyCode": 63, "modifiers": []},' \
            '  "modelSize": "tiny.en",' \
            '  "engine": "whisper",' \
            '  "language": "en",' \
            '  "maxRecordings": 30,' \
            '  "spokenPunctuation": "hybrid"' \
            '}' > ~/.config/speakfree/config.json

      - name: Transcription integration test
        run: bash scripts/test-transcription.sh

  unsigned-artifact:
    # Produces an ad-hoc-signed (not Developer-ID-signed) .app bundle on every
    # push to main. No secrets required — uses bundle-app.sh which runs
    # 'codesign --sign -' (ad-hoc, not a release identity).
    # This job is intentionally separate from the signed local flow in build.sh
    # (which uses 'codesign --sign "Developer ID Application: ..."' and
    # notarytool). It lets contributors verify the build compiles and bundles
    # correctly without needing Apple credentials.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper-cpp
        run: brew install whisper-cpp

      - name: Build release binary
        run: xcrun swift build -c release

      - name: Bundle unsigned .app
        # bundle-app.sh uses 'codesign --sign -' (ad-hoc) — no Developer ID
        # certificate or notarization required.
        run: |
          VERSION=$(grep 'let version' Sources/SpeakFreeLib/Version.swift \
            | sed 's/.*"\(.*\)".*/\1/')
          bash scripts/bundle-app.sh \
            .build/release/speakfree \
            speakfree-unsigned.app \
            "$VERSION"

      - name: Upload unsigned .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakfree-unsigned-app
          path: speakfree-unsigned.app
          if-no-files-found: error
          retention-days: 7
