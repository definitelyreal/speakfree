name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: swift build -c release

  unit-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check for Swift changes (PR only)
        id: filter
        if: github.event_name == 'pull_request'
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only --repo ${{ github.repository }})
          if echo "$CHANGED" | grep -qE '\.(swift)$|^Package\.swift$'; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache tiny.en whisper model
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.config/speakfree/models/ggml-tiny.en.bin
          key: whisper-model-tiny.en-v1

      - name: Download tiny.en whisper model
        if: (github.event_name == 'push' || steps.filter.outputs.swift == 'true') && steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.config/speakfree/models
          curl -fL "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.en.bin" \
            -o ~/.config/speakfree/models/ggml-tiny.en.bin

      - name: Write speakfree config for CI (use tiny.en)
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: |
          mkdir -p ~/.config/speakfree
          cat > ~/.config/speakfree/config.json << 'EOF'
          {
            "modelSize": "tiny.en",
            "engine": "whisper",
            "language": "en",
            "maxRecordings": 30,
            "rememberWords": true,
            "screenContext": true,
            "spokenPunctuation": "hybrid"
          }
          EOF

      - name: Unit tests
        if: github.event_name == 'push' || steps.filter.outputs.swift == 'true'
        run: xcrun swift test

  swiftlint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint (warning-only — non-blocking)
        # Non-blocking: exit code is ignored. Gate (removing continue-on-error) comes
        # once the codebase is cleaned up (post-M1).
        continue-on-error: true
        run: swiftlint

  version-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency check
        run: bash scripts/check-version.sh

  install-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Install smoke test
        run: bash scripts/test-install.sh

  transcription-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install whisper-cpp
        run: brew install whisper-cpp

      - name: Build
        run: swift build -c release

      - name: Transcription integration test
        run: bash scripts/test-transcription.sh
